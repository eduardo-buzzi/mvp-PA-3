<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Resultado</title><link rel="stylesheet" href="/style.css"></head><body><div class="container"><a href="/">← Nova calibração</a><h1>Resultado da calibração</h1><div class="card"><p><b>Certificado:</b> <span th:text="${c.numeroCertificado}"></span></p><p><b>Instrumento:</b> <span th:text="${c.codigoInstrumento+' - '+c.denominacao}"></span></p><p><b>Padrão:</b> <span th:text="${c.codigoPadrao+' / '+c.certificadoPadrao}"></span></p><p><b>Procedimento:</b> <span th:text="${c.codigoProcedimento+' / revisão '+c.revisaoProcedimento}"></span></p><p><b>Status final:</b> <strong th:text="${c.status}"></strong></p><a class="button" th:href="@{'/calibracoes/'+${c.id}+'/pdf'}">Gerar certificado PDF</a></div>
<div class="card"><h2>Pontos avaliados</h2><table><tr><th>Parâmetro</th><th>Nominal</th><th>Med. 1</th><th>Med. 2</th><th>Média</th><th>Erro</th><th>LEA</th><th>Situação</th></tr><tr th:each="r:${c.resultados}"><td th:text="${r.parametro}"></td><td th:text="${#numbers.formatDecimal(r.nominal,1,6)}"></td><td th:text="${#numbers.formatDecimal(r.medida1,1,6)}"></td><td th:text="${#numbers.formatDecimal(r.medida2,1,6)}"></td><td th:text="${#numbers.formatDecimal(r.media,1,6)}"></td><td th:text="${#numbers.formatDecimal(r.erro,1,6)}"></td><td th:text="${#numbers.formatDecimal(r.lea,1,6)}"></td><td th:text="${r.situacao}"></td></tr></table></div></div></body></html>
